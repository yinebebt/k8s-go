apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-go-deployment
  labels:
    app: k8s-go
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app: k8s-go
  template:
    metadata:
      labels:
        app: k8s-go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-go
          image: ghcr.io/yinebebt/k8s-go
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: k8s-go-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-go-secrets
                  key: API_TOKEN
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 1
            failureThreshold: 1
